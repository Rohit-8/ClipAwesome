[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipawesome"
version = "0.1.0"
description = "Suggests the best moments to clip from YouTube videos, topics and local files."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "numpy>=1.26",
    "av>=12",
    "yt-dlp[default]>=2025.1.1",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["clipawesome*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
